<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SPACEX — Verify email</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #000;
        color: #fff;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;
      }
      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
      }
      .card {
        width: min(420px, 100%);
        border: 1px solid #3a3a3a;
        border-radius: 32px;
        padding: 40px 28px 32px;
      }
      .logo {
        text-align: center;
        letter-spacing: 0.22em;
        font-weight: 800;
        margin: 0 0 22px;
      }
      h1 {
        text-align: center;
        font-size: 30px;
        margin: 0 0 12px;
      }
      .sub {
        text-align: center;
        color: #bdbdbd;
        font-size: 15px;
        line-height: 1.45;
        margin: 0 0 28px;
      }
      .otp {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin: 0 0 22px;
      }
      .otp input {
        width: 48px;
        height: 56px;
        border: 1.5px solid #fff;
        border-radius: 12px;
        background: #000;
        color: #fff;
        font-size: 26px;
        font-weight: 600;
        text-align: center;
        outline: none;
      }
      .resend {
        text-align: center;
        color: #bdbdbd;
        font-size: 15px;
        margin: 0 0 24px;
      }
      .resend a {
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
      .confirm {
        width: 100%;
        height: 52px;
        border: 0;
        border-radius: 16px;
        background: #fff;
        color: #000;
        font-size: 17px;
        font-weight: 700;
        cursor: pointer;
      }
      .secure {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        margin: 22px 0 0;
        color: #cfcfcf;
        font-size: 14px;
      }
      .err {
        color: #f87171;
        font-size: 13px;
        text-align: center;
        min-height: 18px;
        margin: 8px 0 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">SPACEX</div>
      <h1>Verify your email</h1>
      <p class="sub">
        We sent a 6-digit code to your email.<br />Enter it below to confirm
        your account.
      </p>
      <form id="verify-form">
        <div class="otp">
          <input
            id="d0"
            maxlength="1"
            inputmode="numeric"
            autocomplete="one-time-code"
          />
          <input id="d1" maxlength="1" inputmode="numeric" />
          <input id="d2" maxlength="1" inputmode="numeric" />
          <input id="d3" maxlength="1" inputmode="numeric" />
          <input id="d4" maxlength="1" inputmode="numeric" />
          <input id="d5" maxlength="1" inputmode="numeric" />
        </div>
        <p class="resend" id="resend-line">
          Didn't get the code? Resend in <span id="timer">0:30</span>
        </p>
        <button class="confirm" type="submit">Confirm & enter account</button>
        <div class="err" id="err"></div>
      </form>
      <p class="secure">This keeps your SpaceX account secure.</p>
    </div>
    <script>
      var boxes = [0, 1, 2, 3, 4, 5].map(function (i) {
        return document.getElementById("d" + i);
      });
      var left = 30,
        timerEl = document.getElementById("timer"),
        line = document.getElementById("resend-line");
      var ticking = setInterval(tick, 1000);
      function tick() {
        left -= 1;
        if (left <= 0) {
          clearInterval(ticking);
          line.innerHTML =
            "Didn't get the code? <a href='#' id='resend'>Resend</a>";
          document.getElementById("resend").onclick = function (e) {
            e.preventDefault();
            left = 30;
            line.innerHTML =
              "Didn't get the code? Resend in <span id='timer'>0:30</span>";
            timerEl = document.getElementById("timer");
            ticking = setInterval(tick, 1000);
          };
          return;
        }
        timerEl.textContent = "0:" + (left < 10 ? "0" : "") + left;
      }
      boxes.forEach(function (el, i) {
        el.addEventListener("input", function () {
          el.value = el.value.replace(/\D/g, "").slice(-1);
          if (el.value && i < 5) boxes[i + 1].focus();
        });
        el.addEventListener("keydown", function (e) {
          if (e.key === "Backspace" && !el.value && i > 0) boxes[i - 1].focus();
        });
        el.addEventListener("paste", function (e) {
          var text = (e.clipboardData || window.clipboardData)
            .getData("text")
            .replace(/\D/g, "")
            .slice(0, 6);
          if (!text) return;
          e.preventDefault();
          text.split("").forEach(function (ch, n) {
            if (boxes[n]) boxes[n].value = ch;
          });
          boxes[Math.min(text.length, 5)].focus();
        });
      });
      const API_BASE = "http://localhost:4000";

      async function api(path, options = {}) {
        const response = await fetch(`${API_BASE}${path}`, {
          headers: {
            "Content-Type": "application/json",
            ...(options.headers || {}),
          },
          ...options,
        });

        const text = await response.text();
        let payload = null;
        try {
          payload = text ? JSON.parse(text) : null;
        } catch (error) {
          payload = { message: text || "Request failed." };
        }

        if (!response.ok) {
          throw new Error(
            payload && payload.message ? payload.message : "Request failed.",
          );
        }

        return payload;
      }

      document.getElementById("verify-form").onsubmit = async function (e) {
        e.preventDefault();

        var pending = null;
        try {
          pending = JSON.parse(
            sessionStorage.getItem("spacex-pending") || "null",
          );
        } catch (x) {}
        if (!pending || !pending.email) {
          document.getElementById("err").textContent =
            "Start from Create account first";
          return;
        }

        var code = boxes
          .map(function (el) {
            return el.value;
          })
          .join("");

        if (pending.otpBypass) {
          code = "000000";
          boxes.forEach(function (el, index) {
            el.value = "000000".charAt(index);
          });
        }

        if (code.length !== 6) {
          document.getElementById("err").textContent = "Enter the 6-digit code";
          return;
        }

        try {
          const data = await api("/api/auth/verify-email", {
            method: "POST",
            body: JSON.stringify({
              email: pending.email,
              otp: code,
            }),
          });

          if (data && data.token) {
            localStorage.setItem("authToken", data.token);
            localStorage.setItem(
              "spacex.user",
              JSON.stringify(data.user || {}),
            );
          }

          var legacy = { users: [], session: null };
          try {
            legacy = JSON.parse(
              localStorage.getItem("spacex.v1") ||
                '{"users":[],"session":null}',
            );
          } catch (x) {}
          legacy.session = String(pending.email).toLowerCase();
          legacy.users = legacy.users || [];
          var existingIndex = -1;
          for (var i = 0; i < legacy.users.length; i++) {
            if (
              String(legacy.users[i].email || "").toLowerCase() ===
              String(pending.email).toLowerCase()
            ) {
              existingIndex = i;
              break;
            }
          }
          if (existingIndex === -1) {
            legacy.users.push({
              fullName: pending.fullName || "",
              username: pending.username || "",
              email: String(pending.email).toLowerCase(),
              plan: pending.plan || "regular",
              referral: pending.referral || "",
              phone: pending.phone || "",
              country: pending.country || "",
              currency: pending.currency || "USD",
              language: pending.language || "English",
              balance: 0,
              isAdmin: false,
            });
          } else {
            legacy.users[existingIndex].fullName =
              pending.fullName || legacy.users[existingIndex].fullName || "";
            legacy.users[existingIndex].username =
              pending.username || legacy.users[existingIndex].username || "";
            legacy.users[existingIndex].plan =
              pending.plan || legacy.users[existingIndex].plan || "regular";
            legacy.users[existingIndex].referral =
              pending.referral || legacy.users[existingIndex].referral || "";
            legacy.users[existingIndex].phone =
              pending.phone || legacy.users[existingIndex].phone || "";
            legacy.users[existingIndex].country =
              pending.country || legacy.users[existingIndex].country || "";
            legacy.users[existingIndex].currency =
              pending.currency || legacy.users[existingIndex].currency || "USD";
            legacy.users[existingIndex].language =
              pending.language ||
              legacy.users[existingIndex].language ||
              "English";
          }
          localStorage.setItem("spacex.v1", JSON.stringify(legacy));
          sessionStorage.removeItem("spacex-pending");
          window.location.href = "home.html";
        } catch (error) {
          document.getElementById("err").textContent =
            error.message || "Verification failed.";
        }
      };
      boxes[0].focus();
    </script>
  </body>
</html>
