<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SPACEX — Forgot password</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    body { min-height: 100dvh; display: grid; place-items: center; }
    .wrap { width: min(430px, 100%); padding: 48px 28px 40px; }
    .mark { width: 240px; height: auto; display: block; margin: 0 auto 8px; }
    .welcome { text-align: center; margin: 18px 0 8px; font-size: 20px; }
    .sub { text-align: center; color: #9a9a9a; margin: 0 0 28px; font-size: 14px; }
    label { display: block; font-size: 16px; margin: 0 0 10px; }
    .field { position: relative; margin-bottom: 18px; }
    .field svg.left {
      position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #fff;
    }
    .field input {
      width: 100%; height: 52px; border-radius: 14px; border: 1px solid #5a5a5a;
      background: #000; color: #fff; padding: 0 48px; font-size: 16px; outline: none;
    }
    .field input::placeholder { color: #8a8a8a; }
    .field input:focus { border-color: #fff; }
    .eye {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      width: 36px; height: 36px; border: 0; background: none; color: #fff;
      cursor: pointer; display: grid; place-items: center;
    }
    .continue {
      width: 100%; height: 52px; border: 0; border-radius: 14px;
      background: #fff; color: #000; font-size: 17px; font-weight: 600; cursor: pointer;
    }
    .ghost {
      width: 100%; height: 52px; margin-top: 10px; border: 1px solid #fff; border-radius: 14px;
      background: #000; color: #fff; font-size: 16px; cursor: pointer;
    }
    .err { color: #f87171; font-size: 13px; min-height: 18px; margin: 8px 0 0; text-align: center; }
    .ok { color: #4ade80; font-size: 13px; text-align: center; margin: 0 0 14px; }
    .otp { display: flex; justify-content: center; gap: 8px; margin: 8px 0 18px; }
    .otp input {
      width: 44px; height: 52px; text-align: center; font-size: 22px;
      border: 1px solid #5a5a5a; border-radius: 10px; background: #000; color: #fff; padding: 0;
    }
    .hint { color: #9a9a9a; font-size: 13px; text-align: center; margin: 0 0 14px; }
    #step2, #step3 { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <svg class="mark" viewBox="0 0 331.644 40.825" fill="#fff" aria-label="SpaceX"><path d="M77.292,15.094H49.249l-1.039,0.777v24.947h7.763v-9.355l0.741-0.664h20.579 c5.196,0,7.632-1.398,7.632-4.985v-5.728C84.924,16.493,82.489,15.094,77.292,15.094 M77.292,24.317 c0,1.69-1.118,2.041-3.554,2.041H56.799l-0.827-0.804V20.21l0.741-0.678h17.025c2.436,0,3.554,0.347,3.554,2.045V24.317z"/><polyline points="99.081,19.813 105.761,29.6 105.391,30.548 90.618,30.548 86.847,35.187 108.837,35.187 110.361,36.115 113.775,40.824 122.659,40.824 103.186,14.775"/><polyline points="187.418,35.757 187.418,28.833 188.217,28.143 203.079,28.143 203.079,23.734 179.524,23.734 179.524,40.823 214.27,40.823 214.27,36.435 188.252,36.435"/><rect x="179.524" y="15.094" width="35.113" height="4.848"/><path d="M140.361,19.685h28.288c-0.436-3.597-2.668-4.595-8.33-4.595H140.06c-6.389,0-8.427,1.247-8.427,6.082 v13.565c0,4.84,2.038,6.087,8.427,6.087h20.259c5.745,0,7.945-1.079,8.095-4.81h-28.053l-0.832-0.783V20.209"/><path d="M29.333,25.118H8.754l-0.606-0.667v-4.402l0.603-0.466h27.742l0.379-0.927 c-0.945-2.431-3.392-3.565-7.936-3.565H9.665c-6.385,0-8.426,1.247-8.426,6.082v2.844c0,4.841,2.041,6.086,8.426,6.086h20.533 l0.645,0.566v4.602l-0.526,0.718H6.83v-0.022H0.678c0,0-0.704,0.353-0.677,0.518c0.525,3.382,2.829,4.34,8.345,4.34h20.987 c6.384,0,8.486-1.247,8.486-6.087v-3.543C37.819,26.363,35.717,25.118,29.333,25.118"/><path d="M236.725,14.988h-11.551l-0.627,1.193l12.828,9.351c2.43-1.407,5.074-2.833,7.95-4.24"/><path d="M247.075,32.603l11.275,8.222h11.692l0.484-1.089L253.69,27.413 C251.454,29.054,249.245,30.787,247.075,32.603"/><path d="M235.006,40.806h-10.451l-0.883-1.383C230.778,32.562,262.56,3.151,331.644,0 C331.644,0,273.658,1.956,235.006,40.806"/></svg>

    <div id="step1">
      <p class="welcome">Forgot password</p>
      <p class="sub">Enter your recovery email or phone.</p>
      <label>Recovery email or phone</label>
      <div class="field">
        <svg class="left" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7">
          <rect x="2.5" y="4.5" width="15" height="11" rx="2"/>
          <path d="m4 6 6 4.5L16 6"/>
        </svg>
        <input id="email" type="text" placeholder="Enter recovery email or phone" />
      </div>
      <button class="continue" type="button" id="go1">Continue</button>
      <button class="ghost" type="button" onclick="window.location.href='login.html'">Back to sign in</button>
      <div class="err" id="e1"></div>
    </div>

    <div id="step2">
      <p class="welcome">Enter reset code</p>
      <p class="hint" id="code-hint">Enter the 6-digit code</p>
      <div class="otp" id="otp">
        <input maxlength="1" inputmode="numeric" />
        <input maxlength="1" inputmode="numeric" />
        <input maxlength="1" inputmode="numeric" />
        <input maxlength="1" inputmode="numeric" />
        <input maxlength="1" inputmode="numeric" />
        <input maxlength="1" inputmode="numeric" />
      </div>
      <button class="continue" type="button" id="go2">Verify code</button>
      <button class="ghost" type="button" id="back1">Back</button>
      <div class="err" id="e2"></div>
    </div>

    <div id="step3">
      <p class="welcome">Set a new password</p>
      <p class="sub">Choose a password with at least 8 characters.</p>
      <label>New password</label>
      <div class="field">
        <svg class="left" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7">
          <rect x="4" y="9" width="12" height="8.5" rx="2"/>
          <path d="M7 9V6.5a3 3 0 0 1 6 0V9"/>
        </svg>
        <input id="pass" type="password" placeholder="New password" />
        <button class="eye" type="button" data-eye="pass" aria-label="Show password">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7">
            <path d="M2 10s3.5-6 8-6 8 6 8 6-3.5 6-8 6-8-6-8-6Z"/>
            <circle cx="10" cy="10" r="2.2"/>
          </svg>
        </button>
      </div>
      <label>Confirm password</label>
      <div class="field">
        <svg class="left" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7">
          <rect x="4" y="9" width="12" height="8.5" rx="2"/>
          <path d="M7 9V6.5a3 3 0 0 1 6 0V9"/>
        </svg>
        <input id="confirm" type="password" placeholder="Re-enter password" />
        <button class="eye" type="button" data-eye="confirm" aria-label="Show password">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7">
            <path d="M2 10s3.5-6 8-6 8 6 8 6-3.5 6-8 6-8-6-8-6Z"/>
            <circle cx="10" cy="10" r="2.2"/>
          </svg>
        </button>
      </div>
      <p class="ok" id="ok"></p>
      <button class="continue" type="button" id="save">Save new password</button>
      <div class="err" id="e3"></div>
    </div>
  </div>

  <script>
    const API_BASE = "http://localhost:4000";
    async function api(path, options) {
      const response = await fetch(API_BASE + path, Object.assign({
        headers: { "Content-Type": "application/json" }
      }, options || {}));
      const payload = await response.json().catch(function () { return {}; });
      if (!response.ok) throw new Error(payload.message || "Request failed.");
      return payload;
    }
    function show(n) {
      document.getElementById("step1").style.display = n === 1 ? "block" : "none";
      document.getElementById("step2").style.display = n === 2 ? "block" : "none";
      document.getElementById("step3").style.display = n === 3 ? "block" : "none";
    }
    var resetCode = "";
    var recoveryContact = "";
    var boxes = document.querySelectorAll("#otp input");
    boxes.forEach(function (el, i) {
      el.oninput = function () {
        this.value = this.value.replace(/\D/g, "").slice(0, 1);
        if (this.value && boxes[i + 1]) boxes[i + 1].focus();
      };
      el.onkeydown = function (e) {
        if (e.key === "Backspace" && !this.value && boxes[i - 1]) boxes[i - 1].focus();
      };
    });
    document.querySelectorAll("[data-eye]").forEach(function (b) {
      b.onclick = function () {
        var el = document.getElementById(b.getAttribute("data-eye"));
        el.type = el.type === "password" ? "text" : "password";
      };
    });
    document.getElementById("go1").onclick = function () {
      var email = document.getElementById("email").value.trim().toLowerCase();
      var e = document.getElementById("e1"); e.textContent = "";
      if (!email) { e.textContent = "Enter your email"; return; }
      recoveryContact = email;
      api("/api/auth/password-reset/request", {
        method: "POST",
        body: JSON.stringify({ recoveryContact: recoveryContact })
      }).then(function (result) {
        resetCode = result.otp || "";
        document.getElementById("code-hint").textContent = result.otpBypass
          ? "Enter the local testing code: " + resetCode
          : "Enter the 6-digit code sent to your recovery contact.";
        show(2);
        boxes[0].focus();
      }).catch(function (error) { e.textContent = error.message; });
    };
    document.getElementById("back1").onclick = function () { show(1); };
    document.getElementById("go2").onclick = function () {
      var v = "";
      boxes.forEach(function (el) { v += el.value; });
      var e = document.getElementById("e2"); e.textContent = "";
      if (v.length !== 6) { e.textContent = "Enter all 6 digits"; return; }
      api("/api/auth/password-reset/verify", {
        method: "POST",
        body: JSON.stringify({ recoveryContact: recoveryContact, otp: v })
      }).then(function () { resetCode = v; show(3); })
        .catch(function (error) { e.textContent = error.message; });
    };
    document.getElementById("save").onclick = function () {
      var p = document.getElementById("pass").value;
      var c = document.getElementById("confirm").value;
      var e = document.getElementById("e3"); e.textContent = "";
      if (p.length < 8 || !/[A-Z]/.test(p) || !/[a-z]/.test(p) || !/[0-9]/.test(p) || !/[^A-Za-z0-9]/.test(p)) {
        e.textContent = "Use 8+ characters with uppercase, lowercase, number, and symbol"; return;
      }
      if (p !== c) { e.textContent = "Passwords do not match"; return; }
      api("/api/auth/password-reset/complete", {
        method: "POST",
        body: JSON.stringify({ recoveryContact: recoveryContact, otp: resetCode, password: p, confirmPassword: c })
      }).then(function () {
        document.getElementById("ok").textContent = "Password updated. Redirecting to sign in...";
        setTimeout(function () { window.location.href = "login.html"; }, 1200);
      }).catch(function (error) { e.textContent = error.message; });
    };
  </script>
</body>
</html>
