<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SPACEX — Settings</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: #000;
        color: #fff;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button,
      input,
      select {
        font-family: inherit;
        color: inherit;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 20px;
        height: 64px;
        padding: 0 22px;
        border-bottom: 1px solid #2a2a2a;
      }
      .top .mark {
        width: 132px;
        height: auto;
        flex-shrink: 0;
        display: block;
      }
      .search-wrap {
        position: relative;
        width: min(340px, 36vw);
        margin-left: 20px;
      }
      .search-wrap svg {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        color: #888;
      }
      .search {
        width: 100%;
        height: 38px;
        border: 1px solid #3a3a3a;
        border-radius: 8px;
        background: #000;
        padding: 0 12px 0 36px;
        color: #fff;
      }
      .right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .who {
        display: flex;
        align-items: center;
        gap: 8px;
        background: none;
        border: 0;
        cursor: pointer;
      }
      .who-pic {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        object-fit: cover;
        display: none;
      }
      .avatar {
        width: 92px;
        height: 92px;
        border-radius: 50%;
        object-fit: cover;
        border: 1px solid #3a3a3a;
        display: block;
        margin: 8px 0;
        background: #111;
      }
      .app {
        display: flex;
        min-height: calc(100dvh - 64px);
      }
      .side {
        width: 210px;
        border-right: 1px solid #2a2a2a;
        padding: 14px 10px;
      }
      .nav a {
        display: flex;
        padding: 10px 12px;
        border-radius: 8px;
        color: #d0d0d0;
      }
      .nav a.on {
        background: #1a1a1a;
        color: #fff;
      }
      .main {
        flex: 1;
        padding: 22px 28px;
        max-width: 860px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 32px;
      }
      .lead {
        color: #cfcfcf;
        margin: 0 0 16px;
      }
      .box {
        border: 1px solid #3a3a3a;
        border-radius: 10px;
        overflow: hidden;
      }
      .sec {
        padding: 14px 18px 6px;
        font-size: 12px;
        letter-spacing: 0.08em;
        color: #cfcfcf;
      }
      .item {
        width: 100%;
        display: flex;
        justify-content: space-between;
        padding: 12px 18px;
        background: none;
        border: 0;
        border-top: 1px solid #2a2a2a;
        text-align: left;
        cursor: pointer;
        font-size: 15px;
      }
      .chev {
        color: #8a8a8a;
      }
      .panel {
        display: none;
      }
      .panel.on {
        display: block;
      }
      .back {
        background: none;
        border: 0;
        color: #cfcfcf;
        cursor: pointer;
        margin-bottom: 12px;
      }
      label {
        display: block;
        font-size: 12px;
        color: #9a9a9a;
        margin: 10px 0 4px;
      }
      input,
      select {
        width: 100%;
        height: 42px;
        border: 1px solid #3a3a3a;
        border-radius: 8px;
        background: #000;
        padding: 0 12px;
      }
      .go {
        height: 44px;
        margin-top: 14px;
        padding: 0 18px;
        border: 0;
        border-radius: 8px;
        background: #fff;
        color: #000;
        font-weight: 700;
        cursor: pointer;
      }
      .ghost {
        height: 40px;
        padding: 0 16px;
        border: 1px solid #fff;
        border-radius: 8px;
        background: #000;
        cursor: pointer;
      }
      .err {
        color: #f87171;
        min-height: 16px;
      }
      .ok {
        color: #86efac;
      }
      .banner {
        border: 1px solid #3a3a3a;
        border-radius: 10px;
        padding: 16px 18px;
        margin-bottom: 18px;
      }
      .banner.on {
        border-color: #86efac;
      }
      .h3 {
        margin: 18px 0 10px;
        font-size: 16px;
      }
      .card2 {
        border: 1px solid #3a3a3a;
        border-radius: 10px;
        padding: 16px 18px;
        margin-bottom: 12px;
        display: grid;
        grid-template-columns: 36px 1fr auto;
        gap: 12px;
        align-items: start;
      }
      .card2 b {
        display: block;
        margin-bottom: 4px;
      }
      .card2 p {
        margin: 0;
        color: #9a9a9a;
        font-size: 13px;
      }
      .okline {
        color: #86efac;
        font-size: 13px;
        margin-top: 8px;
      }
      .offline {
        color: #9a9a9a;
        font-size: 13px;
        margin-top: 8px;
      }
      .secret {
        font-family: ui-monospace, monospace;
        letter-spacing: 0.12em;
        border: 1px solid #3a3a3a;
        border-radius: 8px;
        padding: 12px;
        margin: 10px 0;
      }
      .otp {
        display: flex;
        gap: 8px;
        margin: 12px 0;
      }
      .otp input {
        width: 42px;
        height: 48px;
        text-align: center;
        font-size: 20px;
      }
      .codes {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin: 12px 0;
      }
      .codes span {
        border: 1px solid #3a3a3a;
        border-radius: 8px;
        padding: 10px;
        font-family: ui-monospace, monospace;
        text-align: center;
      }
      .kyc-row {
        display: grid;
        grid-template-columns: 170px 1fr;
        gap: 12px;
        align-items: center;
        margin-bottom: 10px;
      }
      .kbox {
        border: 1px solid #3a3a3a;
        border-radius: 10px;
        padding: 14px 16px;
        margin-bottom: 16px;
      }
      .idpick {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }
      .idpick button {
        height: 46px;
        border: 1px solid #3a3a3a;
        background: #000;
        border-radius: 8px;
      }
      .idpick button.on {
        border-color: #fff;
      }
      .drops {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .dropz {
        border: 1px dashed #555;
        border-radius: 10px;
        min-height: 130px;
        display: grid;
        place-items: center;
        text-align: center;
        cursor: pointer;
        color: #9a9a9a;
        overflow: hidden;
      }
      .dropz img {
        max-height: 128px;
        max-width: 100%;
        display: block;
      }
      .phone {
        display: grid;
        grid-template-columns: 230px 1fr;
        gap: 8px;
      }
      .st-v {
        color: #86efac;
        border-color: #86efac;
      }
      .st-n {
        color: #f87171;
        border-color: #7f1d1d;
      }
      .st-p {
        color: #fbbf24;
        border-color: #854d0e;
      }
      .rowbtns {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      @media (max-width: 800px) {
        .kyc-row,
        .idpick,
        .drops,
        .phone {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 980px) {
        .side {
          display: none;
        }
        .card2 {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

      function codeOf(name) {
        for (var i = 0; i < WORLD.length; i++)
          if (WORLD[i][0] === name) return WORLD[i][1];
        return "+1";
      }
      function get() {
        try {
          return JSON.parse(
            localStorage.getItem("spacex.v1") || '{"users":[],"session":null}',
          );
        } catch (e) {
          return { users: [], session: null };
        }
      }
      function save(d) {
        localStorage.setItem("spacex.v1", JSON.stringify(d));
      }
      function reloadMe() {
        db = get();
        for (var i = 0; i < db.users.length; i++)
          if (
            String(db.users[i].email || "").toLowerCase() ===
            String(me.email).toLowerCase()
          )
            me = db.users[i];
      }
      function twoOn() {
        return !!(me.twoFAApp || me.twoFAEmail);
      }
      function code6() {
        return String(Math.floor(100000 + Math.random() * 900000));
      }
      function secretKey() {
        var s = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567",
          out = "";
        for (var i = 0; i < 16; i++)
          out += s.charAt(Math.floor(Math.random() * s.length));
        return out.match(/.{1,4}/g).join(" ");
      }
      var db = get(),
        me = null;
      for (var i = 0; i < (db.users || []).length; i++)
        if (
          String(db.users[i].email || "").toLowerCase() ===
          String(db.session || "").toLowerCase()
        )
          me = db.users[i];
      if (!me) window.location.href = "login.html";
      document.getElementById("who-name").textContent = me.fullName || me.email;
      function paintIcon() {
        var pic = document.getElementById("who-pic"),
          svg = document.getElementById("who-svg");
        if (me.avatar) {
          pic.src = me.avatar;
          pic.style.display = "block";
          if (svg) svg.style.display = "none";
        }
      }
      paintIcon();
      function shrinkPic(src, done) {
        var img = new Image();
        img.onload = function () {
          var c = document.createElement("canvas");
          c.width = 160;
          c.height = 160;
          c.getContext("2d").drawImage(img, 0, 0, 160, 160);
          done(c.toDataURL("image/jpeg", 0.6));
        };
        img.src = src;

      function bindOtp(id) {
        var boxes = document.querySelectorAll("#" + id + " input");
        boxes.forEach(function (el, i) {
          el.oninput = function () {
            this.value = this.value.replace(/\D/g, "").slice(0, 1);
            if (this.value && boxes[i + 1]) boxes[i + 1].focus();
          };
          el.onkeydown = function (e) {
            if (e.key === "Backspace" && !this.value && boxes[i - 1])
              boxes[i - 1].focus();
          };
        });
      }
      function readOtp(id) {
        var v = "";
        document.querySelectorAll("#" + id + " input").forEach(function (el) {
          v += el.value;
        });
        return v;
      }

      function shrinkKyc(src, done) {
        var img = new Image();
        img.onload = function () {
          var c = document.createElement("canvas");
          var w = 720,
            h = Math.max(1, Math.round((img.height * 720) / img.width));
          c.width = w;
          c.height = h;
          c.getContext("2d").drawImage(img, 0, 0, w, h);
          done(c.toDataURL("image/jpeg", 0.5));
        };
        img.src = src;
      }

            if (k === "live") {
              err.className = "ok";
              err.textContent = "Saved";
            }
          };
      }
      document.querySelectorAll(".item").forEach(function (btn) {
        btn.onclick = function () {
          openPage(
            btn.getAttribute("data-k"),
            btn.childNodes[0].textContent.trim(),
          );
        };
      });
      document.getElementById("back").onclick = function () {
        document.getElementById("page-view").className = "panel";
        document.getElementById("list-view").style.display = "block";
      };
      if (location.hash === "#profile")
        openPage("profile", "Profile Information");
    </script>
  </body>
</html>
